name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check ailab tests demo.py
      - name: Types (mypy)
        run: mypy ailab
      - name: Tests
        run: pytest
      - name: Demo runs
        run: python demo.py > /dev/null
